name: verify-multiline-fromjson

on:
  workflow_dispatch:
    inputs:
      aop_enabled:
        description: 'simulate A5 aop_enabled input (leave empty to simulate PR null)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master

jobs:
  # ============================================================
  # Job A: 写两种格式到 GITHUB_OUTPUT
  # ============================================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      multi_node_ml: ${{ steps.write.outputs.multi_node_ml }}
      multi_node_sl: ${{ steps.write.outputs.multi_node_sl }}
    steps:
      - name: Write outputs
        id: write
        shell: python3 {0}
        run: |
          import json, os
          data = [{"name": "test-case-1", "size": 2, "config_file_path": "test.yaml"}]
          json_str = json.dumps(data, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"multi_node_ml<<EOF\n{json_str}\nEOF\n")
              f.write(f"multi_node_sl={json.dumps(data)}\n")
          print(f"multi_node_ml={json_str}")
          print(f"multi_node_sl={json.dumps(data)}")

  # ============================================================
  # 实验组 1: 多行 + fromJson 直接引用 (已在上次验证通过)
  # ============================================================
  test-ml-direct:
    name: 1-ml-direct
    needs: setup
    if: always()
    strategy:
      matrix:
        case: ${{ fromJson(needs.setup.outputs.multi_node_ml) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "OK name=${{ matrix.case.name }}"

  # ============================================================
  # 实验组 2: 单行 + fromJson 直接引用 (对照组，已在上次验证通过)
  # ============================================================
  test-sl-direct:
    name: 2-sl-direct
    needs: setup
    if: always()
    strategy:
      matrix:
        case: ${{ fromJson(needs.setup.outputs.multi_node_sl) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "OK name=${{ matrix.case.name }}"

  # ============================================================
  # 实验组 3: 模拟 A5 真实场景 ——
  #   inputs.aop_enabled 在 push 事件下为 undefined
  #   直接传递给 uses 的 type:boolean 参数
  #   看矩阵是否还能展开
  # ============================================================
  test-a5-sim:
    name: 3-a5-sim
    needs: setup
    if: always()
    strategy:
      matrix:
        case: ${{ fromJson(needs.setup.outputs.multi_node_ml) }}
    uses: ./.github/workflows/_verify-callee.yml
    with:
      should_run: true
      name: ${{ matrix.case.name }}
      config_file_path: ${{ matrix.case.config_file_path }}
      size: ${{ matrix.case.size }}
      # === 关键：模拟 image_804 传 inputs.aop_enabled (push 事件下为 undefined) ===
      aop_multi_enabled: ${{ inputs.aop_enabled }}

  # ============================================================
  # 实验组 4: 跟实验组 3 一样但加了 fallback || false
  # ============================================================
  test-a5-fix:
    name: 4-a5-fix
    needs: setup
    if: always()
    strategy:
      matrix:
        case: ${{ fromJson(needs.setup.outputs.multi_node_ml) }}
    uses: ./.github/workflows/_verify-callee.yml
    with:
      should_run: true
      name: ${{ matrix.case.name }}
      config_file_path: ${{ matrix.case.config_file_path }}
      size: ${{ matrix.case.size }}
      # === 加了 fallback ===
      aop_multi_enabled: ${{ inputs.aop_enabled || false }}

  # ============================================================
  # Summary
  # ============================================================
  summary:
    name: Summary
    needs: [test-ml-direct, test-sl-direct, test-a5-sim, test-a5-fix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "=============================================="
          echo "  verify-multiline-fromjson v2 实验结果"
          echo "=============================================="
          echo ""
          echo "  1-ml-direct  : ${{ needs.test-ml-direct.result }}"
          echo "    → fromJson(多行<<EOF) 直接引用 (v1已验证通过)"
          echo ""
          echo "  2-sl-direct  : ${{ needs.test-sl-direct.result }}"
          echo "    → fromJson(单行) 直接引用 (对照组)"
          echo ""
          echo "  3-a5-sim     : ${{ needs.test-a5-sim.result }}"
          echo "    → 模拟 image_804: inputs.aop_enabled 无 fallback"
          echo "    → 若为 skipped 说明 undefined → boolean 导致矩阵展开失败"
          echo ""
          echo "  4-a5-fix     : ${{ needs.test-a5-fix.result }}"
          echo "    → 修复方案: inputs.aop_enabled || false"
          echo ""
          echo "=============================================="
          echo ""
          if [ "${{ needs.test-a5-sim.result }}" = "skipped" ] && [ "${{ needs.test-a5-fix.result }}" = "success" ]; then
            echo "🎯 根因确认：inputs.aop_enabled 在非 workflow_dispatch 事件下为 undefined"
            echo "   传递给 type:boolean → 矩阵静默失败 → 0 条目"
            echo "   修复：加 || false fallback"
          elif [ "${{ needs.test-a5-sim.result }}" = "success" ]; then
            echo "🤔 3-a5-sim 成功了，inputs.aop_enabled undefined 不是根因"
            echo "   问题可能在 pull_request 特有的上下文或 workflow_call 调用链"
          else
            echo "⚠️  结果: 3-a5-sim=${{ needs.test-a5-sim.result }}, 4-a5-fix=${{ needs.test-a5-fix.result }}"
          fi
