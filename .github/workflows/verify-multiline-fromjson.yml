name: verify-root-cause

# 验证问题：
#   inputs.<var> 在非 workflow_dispatch 事件下 = 空字符串 ""
#   空字符串传给 workflow_call 的 type:boolean → 被视为"已提供" → 压制 default
#   → 空字符串无法转为 boolean → 矩阵 job 静默失败
#
# Ref: https://github.com/github/docs/issues/31513
#   "An input that is evaluated to empty will be treated as present
#    and suppress your default."

on:
  workflow_dispatch:
    inputs:
      aop_enabled:
        description: 'simulate aop_enabled (leave empty)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master

jobs:
  # ============================================================
  # 准备数据：写一个 JSON 数组到 GITHUB_OUTPUT
  # ============================================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.write.outputs.cases }}
    steps:
      - name: Write output
        id: write
        shell: python3 {0}
        run: |
          import json, os
          data = [{"name":"test-1","size":2,"path":"test.yaml"}]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"cases<<EOF\n{json.dumps(data, separators=(',',':'))}\nEOF\n")

  # ============================================================
  # A: 对照组 — 不传 aop_multi_enabled，用 callee 的 default
  # ============================================================
  A-control:
    name: A-control
    needs: setup
    strategy:
      matrix:
        case: ${{ fromJson(needs.setup.outputs.cases) }}
    uses: ./.github/workflows/_verify-callee.yml
    with:
      should_run: true
      name: ${{ matrix.case.name }}
      config_file_path: ${{ matrix.case.path }}
      # 不传 aop_multi_enabled — callee 的 default:false 生效

  # ============================================================
  # B: 实验组 — 传 inputs.aop_enabled (push事件下 = "")
  #    空字符串抑制 callee 的 default → boolean 类型校验失败
  # ============================================================
  B-undefined-to-boolean:
    name: B-undefined-to-boolean
    needs: setup
    strategy:
      matrix:
        case: ${{ fromJson(needs.setup.outputs.cases) }}
    uses: ./.github/workflows/_verify-callee.yml
    with:
      should_run: true
      name: ${{ matrix.case.name }}
      config_file_path: ${{ matrix.case.path }}
      # ↓ 模拟 image_804 bug: push 事件下 inputs.aop_enabled = ""
      aop_multi_enabled: ${{ inputs.aop_enabled }}

  # ============================================================
  # C: 修复组 — 传 inputs.aop_enabled || false
  # ============================================================
  C-fixed:
    name: C-fixed
    needs: setup
    strategy:
      matrix:
        case: ${{ fromJson(needs.setup.outputs.cases) }}
    uses: ./.github/workflows/_verify-callee.yml
    with:
      should_run: true
      name: ${{ matrix.case.name }}
      config_file_path: ${{ matrix.case.path }}
      # ↓ 修复: || false 兜底，空字符串 → false
      aop_multi_enabled: ${{ inputs.aop_enabled || false }}

  # ============================================================
  # 结果汇总
  # ============================================================
  summary:
    name: Summary
    needs: [A-control, B-undefined-to-boolean, C-fixed]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo ""
          echo "=============================================="
          echo "  根因验证：inputs.<var> + type:boolean"
          echo "  Ref: github/docs#31513"
          echo "=============================================="
          echo ""
          echo "  A-control                  : ${{ needs.A-control.result }}"
          echo "    → 不传 aop_multi_enabled，callee default:false 生效"
          echo ""
          echo "  B-undefined-to-boolean     : ${{ needs.B-undefined-to-boolean.result }}"
          echo "    → ${{ inputs.aop_enabled }} = ''(push), 传给 type:boolean"
          echo "    → 预期: failure (不在job list) — 空串抑制default, 无法转boolean"
          echo ""
          echo "  C-fixed                    : ${{ needs.C-fixed.result }}"
          echo "    → ${{ inputs.aop_enabled || false }}"
          echo "    → 预期: success"
          echo ""
          echo "=============================================="
          echo ""
          echo "  文档证实："
          echo "  'An input that is evaluated to empty will be"
          echo "   treated as present and suppress your default.'"
          echo "  — github/docs#31513"
          echo ""
          echo "  对应 image_804 问题："
          echo "  aop_multi_enabled: \${{ inputs.aop_enabled }}"
          echo "  → PR事件下 inputs.aop_enabled = ''"
          echo "  → 空串传给 _e2e_nightly_multi_node 的 type:boolean"
          echo "  → 压制 default:false → boolean 类型校验失败"
          echo "  → 矩阵 job 静默失败"
          echo "  → 修复: \${{ inputs.aop_enabled || false }}"
          echo ""
          if [ "${{ needs.B-undefined-to-boolean.result }}" != "success" ] && \
             [ "${{ needs.A-control.result }}" = "success" ] && \
             [ "${{ needs.C-fixed.result }}" = "success" ]; then
            echo "  ✅ 根因完全确认！"
          else
            echo "  B result = ${{ needs.B-undefined-to-boolean.result }}"
          fi
