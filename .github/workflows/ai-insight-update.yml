name: AI Insight Update

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
  GC_TOKEN: ${{ secrets.GC_TOKEN }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup environment
        run: bash scripts/setup_env.sh .claude/skills

      - name: Run AI insight analyzer
        id: analyze
        run: |
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"

          echo "=== Starting opencode (model: bailian/MiniMax-M3) ==="

          PROMPT="请使用 ai-insight-analyzer skill 采集 gitcode-dev/euler-api-list 仓库的全部 open issue 并进行 AI 分析。

          重要指示：
          - 在当前工作目录 ($GITHUB_WORKSPACE) 下执行所有操作
          - 生成的 issues-data.json 和 ai-insights.json 必须保存在当前工作目录根下
          - 不要使用 skill 文档中的硬编码路径 /home/wangsike/...
          - 数据采集用 gc issue list -R gitcode-dev/euler-api-list --state open --json
          - 预处理数据生成 issues-data.json
          - 读取数据进行主题聚类和优先级分析
          - 生成 ai-insights.json（有效 JSON，可被 Dashboard fetch 加载）
          - 最后验证两个 JSON 文件的有效性"

          # Save output to file only; sanitize before printing to log.
          # This prevents accidental token/key leakage from gc or opencode debug output.
          opencode run \
            --auto \
            --model bailian/MiniMax-M3 \
            --dir "$GITHUB_WORKSPACE" \
            "$PROMPT" > /tmp/opencode.log 2>&1 || ANALYSIS_EXIT=$?

          # Print sanitized log (filter lines that may contain secrets)
          # GitHub masks secrets.* exact values, but transformed/truncated
          # tokens bypass masking, so we filter proactively.
          grep -ivE '(token|auth|password|secret|api[_-]?key|bearer|credential)' \
            /tmp/opencode.log || true

          if [[ -n "${ANALYSIS_EXIT:-}" ]]; then
            echo "ERROR: opencode exited with code $ANALYSIS_EXIT"
            exit 1
          fi
          echo "=== opencode finished ==="
        timeout-minutes: 15

      - name: Verify outputs
        id: verify
        run: |
          if [[ ! -f ai-insights.json ]] || [[ ! -f issues-data.json ]]; then
            echo "ERROR: output files missing"
            ls -la *.json 2>/dev/null || echo "No JSON files found"
            echo "=== last 50 lines of opencode log (sanitized) ==="
            grep -ivE '(token|auth|password|secret|api[_-]?key|bearer|credential)' \
              /tmp/opencode.log | tail -50 || echo "(log empty or fully filtered)"
            exit 1
          fi
          AI_STATS=$(python3 -c "import json; d=json.load(open('ai-insights.json')); print(f'{d[\"total_issues\"]} issues, {d[\"category_count\"]} categories')")
          DATA_COUNT=$(python3 -c "import json; d=json.load(open('issues-data.json')); print(len(d))")
          echo "ai-insights: $AI_STATS"
          echo "issues-data: $DATA_COUNT issues"
          echo "stats=$AI_STATS" >> $GITHUB_OUTPUT

      - name: Commit and push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-insights.json issues-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            STATS="${{ steps.verify.outputs.stats }}"
            git commit -m "feat: update AI insights analysis

          - Auto-generated by GitHub Actions workflow
          - $STATS"
            git push
            echo "Pushed. GitHub Pages will auto-deploy."
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        if: always()
        run: |
          echo "## AI Insight Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ -f ai-insights.json ]]; then
            STATS=$(python3 -c "import json; d=json.load(open('ai-insights.json')); print(f'{d[\"total_issues\"]} issues, {d[\"category_count\"]} categories')" 2>/dev/null || echo "N/A")
            echo "✅ Analysis complete: $STATS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Themes" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          d=json.load(open('ai-insights.json'))
          for c in d['categories']:
              print(f'- **{c[\"priority\"]}** {c[\"theme\"]} ({c[\"issue_count\"]} issues)')
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            if [[ "${{ steps.push.outputs.pushed }}" == "true" ]]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "📦 Pushed to master. GitHub Pages will auto-deploy." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ Analysis failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi
